<!doctype html>
<meta charset="utf-8">
<title>file-upload example — static root</title>
<h1>This is the static root</h1>
<p>
  It is served at <code>/public</code>. Uploaded files are deliberately
  <strong>not</strong> here — they live in <code>var/uploads</code>, a sibling of
  this directory, and are only reachable through the explicit
  <code>GET /files/:id</code> handler.
</p>
